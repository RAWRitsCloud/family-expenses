<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2742">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/app.webmanifest">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <title>Edit JSON | Our Family Money</title>
  <link rel="stylesheet" href="/assets/root.css">
  <link rel="stylesheet" href="/assets/editor.css">
</head>
<body data-page="editor" data-editor-page="json">
  <div class="editor-page" id="app" hidden>
    <header class="editor-page-head">
      <a class="mobile-brand editor-brand" href="/" aria-label="Back to dashboard">
        <span class="brand-badge"><img class="logo-mark" src="/assets/favicon.svg" alt=""></span>
        <span><b>Our Family Money</b><small>Callum + Conaire</small></span>
      </a>
      <div class="editor-page-actions">
        <span class="hello">Hi, <b id="signedInUser">there</b> 👋</span>
        <a class="button button-ghost" href="/">Dashboard</a>
        <a class="button button-ghost logout-button" id="logoutLink" href="/.auth/logout" title="Sign out">Sign out</a>
      </div>
    </header>
    <main class="editor-page-main">
      <section class="drawer editor-screen-panel open" id="editorDrawer" aria-hidden="false">
        <div class="drawer-head">
          <h2>Edit JSON</h2>
          <button class="close-button" id="closeEditor" aria-label="Back to dashboard">×</button>
        </div>
        <nav class="drawer-tabs" aria-label="Editor sections">
          <a class="tab" href="/editor/expenses.html">Friendly editor</a>
          <a class="tab" href="/editor/categories.html">Categories</a>
          <a class="tab" href="/editor/family.html">Family</a>
          <a class="tab active" href="/editor/json.html">JSON</a>
        </nav>
        <div class="drawer-body">
          <section id="jsonTab" class="json-editor-panel">
            <textarea id="jsonEditor" spellcheck="false"></textarea>
            <button class="button button-pop" id="formatJson" type="button">Make JSON tidy</button>
          </section>
        </div>
        <div class="drawer-foot">
          <div class="status is-idle" id="status">Ready</div>
          <div>
            <button class="button button-ghost" id="cancelEditor">Cancel</button>
            <button class="button button-ink" id="saveExpenses">Save to GitHub</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
