name: Live App Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/expenses.json"
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  deploy_live_job:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy Live App
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      - name: Install dependencies and build Vite app
        run: |
          npm install
          npm run build

      - name: Apply Live Configuration
        run: |
          cp staticwebapp.config.live.json dist/staticwebapp.config.json
          mkdir -p dist/assets
          printf 'window.FAMILY_EXPENSES_APP_MODE = "live";\n' > dist/assets/runtime-config.js

      - name: Verify live route config
        run: node -e "const config=require('./dist/staticwebapp.config.json'); const editor=config.routes.find(route => route.route === '/editor/*'); if (!editor || !editor.allowedRoles.includes('family')) throw new Error('Live route config is not protected');"

      - name: Deploy live app
        id: builddeploy_live
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_MUSHROOM_0AC377B03 }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          skip_app_build: false

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"