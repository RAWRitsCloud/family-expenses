name: Live App Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/expenses.json"
  schedule:
    # Refresh the deployed static data copy once a month.
    - cron: "17 6 1 * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  deploy_live_job:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy Live App
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Prepare live static app
        run: |
          mkdir dist-live
          cp -r assets auth data editor app.webmanifest index.html dist-live/
          cp staticwebapp.config.live.json dist-live/staticwebapp.config.json
          printf 'window.FAMILY_EXPENSES_APP_MODE = "live";\n' > dist-live/assets/runtime-config.js

      - name: Verify live route config
        run: node -e "const config=require('./dist-live/staticwebapp.config.json'); const editor=config.routes.find(route => route.route === '/editor/*'); if (!editor || !editor.allowedRoles.includes('family')) throw new Error('Live route config is not protected');"

      - name: Deploy live app
        id: builddeploy_live
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_MUSHROOM_0AC377B03 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist-live" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
