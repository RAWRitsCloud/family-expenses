name: Demo App Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/expenses.json"
  schedule:
    # Refresh the deployed static data copy once a month.
    - cron: "17 6 1 * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  deploy_demo_job:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy Demo App
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      - name: Install dependencies and build Vite app
        run: |
          npm install
          npm run build

      - name: Apply Demo Configuration
        run: |
          cp staticwebapp.config.demo.json dist/staticwebapp.config.json
          mkdir -p dist/assets
          printf 'window.FAMILY_EXPENSES_APP_MODE = "demo";\n' > dist/assets/runtime-config.js

      - name: Verify demo route config is anonymous
        run: |
          node -e "const c=require('./dist/staticwebapp.config.json'); const locked=c.routes.find(r => Array.isArray(r.allowedRoles) && r.allowedRoles.includes('family')); if (locked) throw new Error('Demo route still requires the family role: ' + locked.route); const root=c.routes.find(r => r.route === '/*'); if (!root || !root.allowedRoles.includes('anonymous')) throw new Error('Demo catch-all route is not anonymous');"

      - name: Deploy demo app
        id: builddeploy_demo
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_MOSS_0115BC403 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Pre-built Vite output (skip_app_build below)
          github_id_token: ${{ steps.idtoken.outputs.result }}
          # We build above and copy the demo config into dist; skip_app_build stops
          # Oryx re-running the build and wiping staticwebapp.config.json / runtime-config.js.
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
